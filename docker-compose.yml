services:
  backend:
    container_name: backend
    build:
      context: backend/
      dockerfile: Dockerfile
    ports:
      - 3000:3000
    environment:
      - MYSQL_HOST=db
      - MYSQL_USER=root
      - MYSQL_PASSWORD=''
      - MYSQL_DB=dbentrada
      - JWT_SEGREDO=minhachavesupersecreta123
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - NODE_ENV=development
      - MQTT_HOST=broker-mqtt
      - MQTT_PORT=1884
      - MQTT_PROTOCOL=mqtt
      - BACKUP_RETENTION_DAYS=90
    volumes:
      - ./backend/bin:/app/backend/bin
      - ./backend/config:/app/backend/config
      - ./backend/controllers:/app/backend/controllers
      - ./backend/models:/app/backend/models
      - ./backend/routes:/app/backend/routes
      - ./backend/scripts:/app/backend/scripts
      - ./backend/app.js:/app/backend/app.js
      - ./backend/package.json:/app/backend/package.json
      - shared-volume:/imagens/
      - backup-volume:/backups/
    depends_on:
      migration:
        condition: service_completed_successfully
      broker-mqtt:
        condition: service_started
    networks:
      - my-networks
    restart: unless-stopped
    command: npm start
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: frontend/
      dockerfile: Dockerfile
    ports:
      - 80:80
      - 443:443
    volumes:
      - shared-volume:/usr/share/nginx/html/assets/images/entrada/
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - my-networks
    restart: unless-stopped

  db:
    image: mysql:8.0.33
    container_name: db
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
      - MYSQL_DATABASE=dbentrada
    restart: unless-stopped
    ports:
      - 3306:3306
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - my-networks
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: pma
    links:
      - db
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
      - PMA_ARBITRARY=1
    restart: unless-stopped
    ports:
      - 8082:80
    networks:
      - my-networks
    depends_on:
      db:
        condition: service_healthy
  
  migration:
    build:
      context: backend/
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    networks:
      - my-networks
    command: >
      sh -c "
        echo 'Aguardando 20 segundos para garantir que o MySQL esteja pronto...' &&
        sleep 20 &&
        npx sequelize-cli db:migrate &&
        echo 'Migrações executadas com sucesso!' &&
        (npx sequelize db:seed:all || echo 'Seeds executados com avisos (podem ser ignorados)') &&
        echo 'Processo de migração concluído com sucesso!' &&
        exit 0
      "

  broker-mqtt:
    image: eclipse-mosquitto:latest
    container_name: broker-mqtt
    ports:
      - 1884:1884
    networks:
      - my-networks
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
      - ./mosquitto/certificados:/mosquitto/certificados
    restart: unless-stopped
    
  backup:
    container_name: backup-service
    build:
      context: backend/
      dockerfile: Dockerfile.backup
    volumes:
      - shared-volume:/imagens/
      - backup-volume:/backups/
    networks:
      - my-networks
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    
volumes:
  mysql-data:
  shared-volume:
  backup-volume:
networks:
  my-networks: