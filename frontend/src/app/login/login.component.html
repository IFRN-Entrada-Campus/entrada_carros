<div class="surface-card">
    <div class="title">
        <p>Fazer Login</p>
        <div *ngIf="loginInvalid">Login ou senha inválidos. Verifique os
            campos e tente novamente.</div>
    </div>
    <div>
        <label htmlFor="usuario" class="block text-white-900 font-medium mb-2">Usuario:</label>
        <input pInputText  class="w-full mb-3"  type="text" id="usuario" [(ngModel)]="usuario" placeholder="Insira seu login...">
    </div>
    <div>
        <label htmlFor="senha" class="block text-white-900 font-medium mb-2">Senha:</label>
        <input class="w-full mb-3" pInputText type="password" id="senha" [(ngModel)]="senha" placeholder="Insira sua senha...">
    </div>
    <button label="Logar" (click)="fazerLogin()">Logar</button>
</div>
