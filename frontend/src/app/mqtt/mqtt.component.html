<section class="main">
    <app-menu></app-menu>
    <div *ngIf="!carregando">  
        <div>
            <br>
            <h2>Histórico de entrada de carros:</h2>
            <p-table [value]="dados" [tableStyle]="{ 'max-width': '50rem'}" [rows]="10" [paginator]="true" [showCurrentPageReport]="true"
                 [rowsPerPageOptions]="[10, 20, 30]">
                <ng-template pTemplate="body" class="bodyTable" let-dado>
                    <tr>
                        <td class="cardHistorico">
                            <div class="img">
                                <img [src]="dado.img" alt="Imagem capturada do carro" style="max-width: 200px;">
                            </div>
                            <div class="dados">
                                <ul >
                                    <li>Motorista: {{ dado.nomePessoa }}</li>
                                    <li>Vínculo {{ dado.vinculo }}</li>
                                    <li>{{ dado.tipoId }}: {{ dado.idPessoa }}</li>
                                    <li>Placa: {{ dado.placa }}</li>
                                    <li>Horário de chegada: {{ dado.dataHora }}</li>
                                </ul>
                            </div>
                        </td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
    </div>
</section>
